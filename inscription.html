
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription patient - Clinique Maranatha</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f1f6f4;
      color: #243247;
      margin: 0;
      padding: 25px 15px;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 15px #0001;
    }

    h1, h2 { color: #17665b; }
    h1 { text-align: center; }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccd6d2;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #17665b;
      color: white;
      border: 0;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    .notice {
      padding: 12px;
      background: #fff5dc;
      border-radius: 6px;
      line-height: 1.5;
    }

    a { color: #17665b; }
  </style>
</head>

<body>
  <div class="container">
    <h1>Inscription du patient</h1>
    <p><strong>Clinique Maranatha – Centre de Physiothérapie</strong></p>

    <p class="notice">
      Ce formulaire est en cours de développement.
      Pour le moment, utilisez uniquement de fausses informations
      pendant les essais.
    </p>

    <h2>Informations personnelles</h2>

    <form id="patientForm">
      <label for="nom">Nom *</label>
      <input id="nom" name="nom" type="text" required>

      <label for="prenom">Prénom *</label>
      <input id="prenom" name="prenom" type="text" required>

      <label for="naissance">Date de naissance</label>
      <input id="naissance" name="naissance" type="date">

      <label for="sexe">Sexe</label>
      <select id="sexe" name="sexe">
        <option value="">Choisissez</option>
        <option value="F">Féminin</option>
        <option value="M">Masculin</option>
        <option value="autre">Autre / préfère ne pas préciser</option>
      </select>

      <label for="telephone">Téléphone *</label>
      <input id="telephone" name="telephone" type="tel" required>

      <label for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email">

      <label for="adresse">Adresse de résidence</label>
      <textarea id="adresse" name="adresse" rows="3"></textarea>

      <h2>Personne à contacter</h2>

      <label for="responsable">Nom de la personne responsable</label>
      <input id="responsable" name="responsable" type="text">

      <label for="telresponsable">Téléphone de cette personne</label>
      <input id="telresponsable" name="telresponsable" type="tel">

      <h2>Informations complémentaires</h2>

      <label for="profession">Profession</label>
      <input id="profession" name="profession" type="text">

      <label for="medecin">Médecin référent</label>
      <input id="medecin" name="medecin" type="text">

      <button id="submitButton" type="submit">
        Envoyer mon inscription
      </button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p><a href="index.html">← Retour à l'accueil</a></p>
  </div>

  <script>
    const form = document.getElementById("patientForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const data = Object.fromEntries(
        new FormData(form).entries()
      );

      button.disabled = true;
      message.textContent = "Enregistrement en cours...";

      try {
        const response = await fetch("/api/patients", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || "Erreur d'enregistrement.");
        }

        message.textContent = "Inscription enregistrée avec succès !";
        form.reset();

      } catch (error) {
        message.textContent =
          "Impossible d'enregistrer l'inscription. Veuillez réessayer.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
