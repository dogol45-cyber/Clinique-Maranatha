
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda - Clinique Maranatha</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6f9;color:#243447}
header{background:#183b58;color:white;padding:18px 25px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h2{margin:0;font-size:20px}
button{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;font-weight:bold}
header button{background:white;color:#183b58}
nav{background:white;padding:12px 22px;border-bottom:1px solid #e1e6eb}
nav a{display:inline-block;color:#34495e;text-decoration:none;padding:10px 13px;border-radius:6px}
nav a:hover,nav a.active{background:#eaf1f6;color:#183b58;font-weight:bold}
main{max-width:1250px;margin:auto;padding:25px}
h1{margin-top:0;font-size:25px}
.panel{background:white;border-radius:12px;padding:22px;margin-bottom:20px;box-shadow:0 2px 10px #00000008}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px;color:#526579}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd5de;border-radius:6px;font-size:15px}
.full{grid-column:1/-1}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.primary{background:#183b58;color:white}
.secondary{background:#e8edf2;color:#263849}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #edf0f3;font-size:14px}
th{color:#607386;font-size:13px}
.status{padding:6px 8px;border-radius:5px;background:#edf1f5;font-size:12px}
.smallbtn{padding:7px 9px;background:#eaf1f6;color:#183b58;margin:2px}
#message,#formMessage{color:#526579}
.error{color:#a32626!important}
@media(max-width:650px){
main{padding:15px}
.grid{grid-template-columns:1fr}
.full{grid-column:auto}
header{padding:15px}
}
</style>
</head>
<body>
<header>
  <div>
    <h2>CLINIQUE MARANATHA</h2>
    <small>Centre de physiothérapie</small>
  </div>
  <button onclick="deconnexion()">Déconnexion</button>
</header>

<nav>
  <a href="administration.html">Tableau de bord</a>
  <a href="paiements.html">Paiements</a>
  <a href="inscription.html">Inscription patient</a>
  <a href="patients.html">Dossiers patients</a>
  <a href="agenda.html" class="active">Agenda</a>
</nav>

<main>
  <h1>Gestion des rendez-vous</h1>

  <section class="panel">
    <h2>Programmer un rendez-vous</h2>
    <form id="formRdv">
      <div class="grid">
        <div class="field full">
          <label for="patient">Patient *</label>
          <select id="patient" required>
            <option value="">Chargement des patients...</option>
          </select>
        </div>
        <div class="field">
          <label for="service">Service *</label>
          <select id="service" required>
            <option value="">Choisir un service</option>
            <option>Physiothérapie</option>
            <option>Massothérapie</option>
            <option>Rééducation fonctionnelle</option>
            <option>Club des AVC</option>
            <option>Évaluation</option>
            <option>Autre</option>
          </select>
        </div>
        <div class="field">
          <label for="date">Date *</label>
          <input id="date" type="date" required>
        </div>
        <div class="field">
          <label for="heure">Heure</label>
          <input id="heure" type="time">
        </div>
        <div class="field full">
          <label for="motif">Motif ou remarque</label>
          <textarea id="motif" rows="3" placeholder="Précisions utiles pour le rendez-vous"></textarea>
        </div>
      </div>
      <div class="actions">
        <button class="primary" type="submit">Enregistrer le rendez-vous</button>
      </div>
      <p id="formMessage"></p>
    </form>
  </section>

  <section class="panel">
    <h2>Agenda des rendez-vous</h2>
    <div class="grid">
      <div class="field">
        <label for="filtreDate">Afficher les rendez-vous du jour</label>
        <input id="filtreDate" type="date">
      </div>
      <div class="field" style="display:flex;align-items:end;gap:8px">
        <button class="primary" onclick="chargerRendezVous()">Rechercher</button>
        <button class="secondary" onclick="toutAfficher()">Tout afficher</button>
      </div>
    </div>
    <p id="message">Chargement des rendez-vous...</p>
    <div class="table-wrap" id="liste"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

async function chargerPatients(){
  try{
    const response=await fetch("/api/admin/rendez-vous?patients=1",{
      credentials:"same-origin"
    });

    if(response.status===401){
      location.href="/connexion.html";
      return;
    }

    const data=await response.json();
    if(!response.ok || !data.success) throw new Error(data.message || "Erreur.");

    const select=$("patient");
    select.replaceChildren(new Option("Choisir un patient",""));

    data.patients.forEach(p=>{
      const option=new Option(
        p.prenom+" "+p.nom+" — "+(p.telephone || "Sans téléphone"),
        p.id
      );
      select.add(option);
    });

    if(data.patients.length===0){
      select.replaceChildren(new Option("Aucun patient inscrit",""));
    }
  }catch(error){
    $("patient").replaceChildren(new Option("Erreur de chargement",""));
    $("formMessage").textContent=error.message;
  }
}

async function chargerRendezVous(){
  $("message").textContent="Chargement...";
  $("liste").replaceChildren();

  try{
    const date=$("filtreDate").value;
    const url="/api/admin/rendez-vous"+(date?"?date="+encodeURIComponent(date):"");
    const response=await fetch(url,{credentials:"same-origin"});

    if(response.status===401){
      location.href="/connexion.html";
      return;
    }

    const data=await response.json();
    if(!response.ok || !data.success) throw new Error(data.message || "Erreur.");

    afficherRendezVous(data.rendezVous || []);
    $("message").textContent=(data.rendezVous || []).length+" rendez-vous trouvé(s).";
  }catch(error){
    $("message").textContent=error.message;
    $("message").className="error";
  }
}

function afficherRendezVous(liste){
  const zone=$("liste");

  if(liste.length===0){
    zone.textContent="Aucun rendez-vous trouvé.";
    return;
  }

  const table=document.createElement("table");
  table.innerHTML="<thead><tr><th>Patient</th><th>Téléphone</th><th>Date</th><th>Heure</th><th>Service</th><th>Statut</th><th>Actions</th></tr></thead>";
  const tbody=document.createElement("tbody");

  liste.forEach(r=>{
    const tr=document.createElement("tr");
    const valeurs=[
      r.prenom+" "+r.nom,
      r.telephone || "—",
      r.date_rendez_vous,
      r.heure || "—",
      r.service
    ];

    valeurs.forEach(valeur=>{
      const td=document.createElement("td");
      td.textContent=valeur;
      tr.appendChild(td);
    });

    const statutCell=document.createElement("td");
    const badge=document.createElement("span");
    badge.className="status";
    badge.textContent=libelleStatut(r.statut);
    statutCell.appendChild(badge);
    tr.appendChild(statutCell);

    const actions=document.createElement("td");
    const choix=document.createElement("select");

    [
      ["en_attente","En attente"],
      ["confirme","Confirmé"],
      ["termine","Terminé"],
      ["annule","Annulé"]
    ].forEach(([value,label])=>{
      choix.add(new Option(label,value));
    });

    choix.value=r.statut;
    choix.addEventListener("change",()=>modifierStatut(r.id,choix.value));

    actions.appendChild(choix);
    tr.appendChild(actions);
    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  zone.appendChild(table);
}

function libelleStatut(statut){
  const labels={
    en_attente:"En attente",
    confirme:"Confirmé",
    termine:"Terminé",
    annule:"Annulé"
  };
  return labels[statut] || statut;
}

$("formRdv").addEventListener("submit",async event=>{
  event.preventDefault();
  $("formMessage").textContent="Enregistrement en cours...";

  const donnees={
    patient_id:Number($("patient").value),
    service:$("service").value,
    date_rendez_vous:$("date").value,
    heure:$("heure").value,
    motif:$("motif").value
  };

  try{
    const response=await fetch("/api/admin/rendez-vous",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      credentials:"same-origin",
      body:JSON.stringify(donnees)
    });

    if(response.status===401){
      location.href="/connexion.html";
      return;
    }

    const data=await response.json();
    if(!response.ok || !data.success) throw new Error(data.message || "Erreur.");

    $("formMessage").textContent="Rendez-vous enregistré avec succès.";
    $("formRdv").reset();
    chargerRendezVous();
  }catch(error){
    $("formMessage").textContent=error.message;
    $("formMessage").className="error";
  }
});

async function modifierStatut(id,statut){
  try{
    const response=await fetch("/api/admin/rendez-vous",{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      credentials:"same-origin",
      body:JSON.stringify({id,statut})
    });

    if(response.status===401){
      location.href="/connexion.html";
      return;
    }

    const data=await response.json();
    if(!response.ok || !data.success) throw new Error(data.message || "Erreur.");

    $("message").textContent="Statut mis à jour.";
    chargerRendezVous();
  }catch(error){
    $("message").textContent=error.message;
    $("message").className="error";
    chargerRendezVous();
  }
}

function toutAfficher(){
  $("filtreDate").value="";
  chargerRendezVous();
}

async function deconnexion(){
  try{
    await fetch("/api/logout",{method:"POST",credentials:"same-origin"});
  }finally{
    location.href="/connexion.html";
  }
}

chargerPatients();
chargerRendezVous();
</script>
</body>
</html>
